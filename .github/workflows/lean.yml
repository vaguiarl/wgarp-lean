name: Lean

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Reject unfinished proofs and custom axioms
        shell: bash
        run: |
          if grep -RInE '(^|[[:space:]])(sorry|admit)([[:space:]]|$)|^[[:space:]]*((private|protected)[[:space:]]+)?(axiom|constant)[[:space:]]' \
              --include='*.lean' WGARP WGARP.lean; then
            exit 1
          fi

      - name: Build the complete proof package
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: false
          use-github-cache: true
          use-mathlib-cache: true
